services:
  mysql:
    image: mysql:8.4
    container_name: clinical-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: clinical
      MYSQL_PASSWORD: clinical
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  ms-administrativo:
    build:
      context: .
      dockerfile: ms-administrativo/Dockerfile
    image: clinical/ms-administrativo:latest
    container_name: ms-administrativo
    environment:
      DB_URL: jdbc:mysql://mysql:3306/clinical_administrativo?serverTimezone=UTC
      DB_USER: clinical
      DB_PASSWORD: clinical
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ms-agendamento:
    build:
      context: .
      dockerfile: ms-agendamento/Dockerfile
    image: clinical/ms-agendamento:latest
    container_name: ms-agendamento
    environment:
      DB_URL: jdbc:mysql://mysql:3306/clinical_agendamento?serverTimezone=UTC
      DB_USER: clinical
      DB_PASSWORD: clinical
      ADMINISTRATIVO_URL: http://ms-administrativo:8081
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      ms-administrativo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: clinical/api-gateway:latest
    container_name: api-gateway
    environment:
      ADMINISTRATIVO_URL: http://ms-administrativo:8081
      AGENDAMENTO_URL: http://ms-agendamento:8082
    ports:
      - "8080:8080"
    depends_on:
      ms-administrativo:
        condition: service_healthy
      ms-agendamento:
        condition: service_healthy

volumes:
  mysql-data:
